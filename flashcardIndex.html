<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
    <title>Flashcard App</title>

    <link rel="stylesheet" href="flashcardStyle.css">
</head>
<body>
    <div class="container">
        <div class="add-flashcard-container">
            <button id="add-flashcard">Add Card</button>
        </div>
        <div id="card-container">
            <div class="card-list-container"></div>
        </div>
    </div>
    <div class="question-container hidden" id="add-question-flashcard">
        <h2>Add your Flashcard</h2>
        <div class="wrapper">
            <div class="error-container"
            <span class="hidden" id="error">Text Cannot Be Empty.</span>
            </div>
            <span class="material-symbols-outlined" id="close-button">close</span>
        </div>
        <label for="question">Question:</label>
        <textarea class="input" id="question" rows="2.5" placeholder="Type your question here..."></textarea>
        <label for="answer">Answer:</label>
        <textarea class="input" id="answer" rows="4.5" placeholder="Type your answer here..."></textarea>
        <button id="save-button">Save Card</button>
    </div>
<script src="flashcardScript.js"></script>
</body>
</html>
